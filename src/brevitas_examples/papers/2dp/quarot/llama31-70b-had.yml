# Llama-3.1-70B, MXFP4 W4A4 (e2m1, E8M0 floor-rounded block-32 scales) with QuaRot rotations:
# R1 random Hadamard, R2 deterministic Hadamard, R4 online Hadamard on down_proj.
# Q, K, V quantized (MXFP4). QK^T head: QuaRot R3 (head-dim Hadamard on Q/K).
bos_preprocessing: sequence
dtype: bfloat16
eval: true
replace_rmsnorm: true
ln_affine_merge: true
model: meta-llama/Llama-3.1-70B
rotation: fused_no_fx
rotation_mode: had_rand
rotation_orphan_sink: true
rotation_sdpa_regions: false
rotation_sdpa_value_det: true
scale_rounding_func_type: floor
weight_bit_width: 4
weight_quant_format: float_ocp_e2m1
weight_group_size: 32
weight_param_method: mse
weight_quant_granularity: per_group
weight_quant_type: sym
weight_scale_precision: po2_scale
input_bit_width: 4
input_quant_format: float_ocp_e2m1
input_group_size: 32
input_param_method: stats
input_quant_granularity: per_group
input_quant_type: sym
input_scale_precision: po2_scale
input_scale_type: dynamic
quant_sdpa: eager
attn_quant_config: qkv
attn_bit_width: 4
attn_quant_format: float_ocp_e2m1
attn_group_size: 32
attn_quant_granularity: per_group
attn_quant_type: sym
attn_scale_precision: po2_scale
attn_scale_type: dynamic
dc_extract_qk: true
dc_sub_dim: -1
dataset_eval_split: test
nsamples: -1
